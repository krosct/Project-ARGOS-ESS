[pytest]
# Configurações do pytest para o projeto Argos

# Diretórios onde buscar testes
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py *_test.py

# Padrão de classes de teste
python_classes = Test*

# Padrão de funções de teste
python_functions = test_*

# Opções padrão para execução
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Markers customizados
markers =
    unit: Testes unitários isolados
    integration: Testes de integração com dependências
    slow: Testes que demoram mais tempo
    smoke: Testes de smoke (básicos e rápidos)

# Configuração de cobertura
[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: